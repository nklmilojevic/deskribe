[package]
name = "deskribe"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
description = "Native Kubernetes resource descriptions using a caller-provided kube client"
readme = "README.md"
repository = "https://github.com/nklmilojevic/deskribe"

[dependencies]
base64 = "0.23.0"
futures-util = "0.3.32"
k8s-openapi = { version = "0.28", default-features = false }
kube = { version = "4.2.0", default-features = false, features = ["client"] }
memchr = "2.8.3"
serde = "1.0.228"
serde_json = "1.0.150"
smallvec = "1.15.2"
tokio = { version = "1.52.3", features = ["macros"] }
x509-parser = { version = "0.18", default-features = false }

[dev-dependencies]
k8s-openapi = { version = "0.28", features = ["latest"] }
tokio = { version = "1.52.3", features = ["macros", "rt", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
http = "1.4.2"
http-body-util = "0.1.3"
